<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AXIS Sync UI Dummy Test</title>
<link rel="stylesheet" href="../theme-v16-sync.css?v=1">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
body{padding:12px}
.ax16-panel{width:100%;max-width:100%;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:14px}
.ax16-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ax16-h{display:flex;align-items:center;gap:8px;font-weight:800;min-width:0}
.ax16-btn{border:0;border-radius:12px;padding:11px 13px;font-weight:800}
.ax16-btn.pri{background:#2563eb;color:#fff}
.ax16-btn.soft{background:#eaf1ff;color:#2563eb}
.parent{display:grid;gap:18px}
.case{background:#fff;border:1px solid #dbe2ea;border-radius:14px;padding:10px;overflow:auto}
.case h2{font-size:14px;margin:0 0 8px}
.case iframe{display:block;border:1px solid #cbd5e1;height:700px;max-width:100%;background:#f4f7fb}
.result{font-weight:800;font-size:13px;margin-top:6px}
.pass{color:#166534}.fail{color:#991b1b}
</style>
</head>
<body>
<div id="root"></div>
<script>
const child=new URLSearchParams(location.search).get("child");
if(child){
 document.body.style.padding="9px";
 document.querySelector("#root").innerHTML=`
 <div class="ax16-panel axsync-card">
  <div class="ax16-head"><div class="ax16-h"><span>↻</span>端末間の自動同期</div><span class="axsync-state">未同期</span></div>
  <div class="axsync-row"><label class="axsync-toggle"><input type="checkbox"><span>自動同期</span></label><button class="ax16-btn pri">今すぐ同期</button></div>
  <div class="axsync-meta"><span>最終同期</span><b>2026/09/20 13:41:00</b></div>
  <div class="axsync-error">DUMMY ERROR ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ</div>
  <details class="axsync-settings" open><summary>同期先設定</summary><div class="axsync-fields">
   <label>Apps Script WebアプリURL<input value="https://script.google.com/macros/s/DUMMY_ONLY_NOT_REAL/exec"></label>
   <label>同期トークン<input type="password" value="DUMMY_TOKEN_ONLY_NOT_REAL_ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"></label>
   <div class="axsync-actions"><button class="ax16-btn soft">設定を保存・接続確認</button></div>
  </div></details>
  <p class="axsync-note">顧客情報はブラウザでAES-GCM暗号化してから送信します。URL・トークンはこの端末だけに保存されます。</p>
 </div>`;
 const report=()=>{
   const de=document.documentElement;
   parent.postMessage({axisSyncWidth:child,scrollWidth:de.scrollWidth,clientWidth:de.clientWidth,overflow:de.scrollWidth>de.clientWidth},"*");
 };
 requestAnimationFrame(()=>requestAnimationFrame(report));
}else{
 const widths=[375,390,430];
 document.querySelector("#root").innerHTML='<h1 style="font-size:18px">AXIS Sync UI width test — dummy only</h1><div class="parent">'+widths.map(w=>`
 <div class="case"><h2>${w}px</h2><iframe title="${w}px" style="width:${w}px" src="?child=${w}"></iframe><div class="result" id="r${w}">RUNNING</div></div>`).join("")+'</div>';
 addEventListener("message",e=>{
   const d=e.data||{};if(!d.axisSyncWidth)return;
   const el=document.querySelector("#r"+d.axisSyncWidth);
   const pass=!d.overflow&&Number(d.clientWidth)===Number(d.axisSyncWidth);
   el.className="result "+(pass?"pass":"fail");
   el.textContent=(pass?"PASS":"FAIL")+" scrollWidth="+d.scrollWidth+" clientWidth="+d.clientWidth;
   document.body.dataset["w"+d.axisSyncWidth]=pass?"PASS":"FAIL";
 });
}
</script>
</body></html>
