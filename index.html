<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03060d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AXIS Training">
<title>AXIS TRAINING</title>
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="next/styles/tokens.css?v=1">
<link rel="stylesheet" href="next/styles/app.css?v=3">
<link rel="stylesheet" href="next/styles/home.css?v=5">
<link rel="stylesheet" href="next/styles/clients.css?v=5">
<link rel="stylesheet" href="next/styles/report.css?v=2">
<link rel="stylesheet" href="next/styles/schedule.css?v=2">
<link rel="stylesheet" href="next/styles/settings.css?v=2">
<link rel="stylesheet" href="next/styles/train.css?v=7">
<link rel="stylesheet" href="next/styles/history.css?v=4">
<link rel="stylesheet" href="next/styles/muscle-map.css?v=1">
<link rel="stylesheet" href="next/styles/layout-v2.css?v=1">
</head>
<body>

<div id="lock" class="ax-lock">
  <h1>A<i>X</i>IS</h1>
  <p>TRAINING MANAGER</p>
  <input id="pass" class="ax-input" type="password" placeholder="アクセスコード" autocomplete="current-password">
  <button id="unlock" class="ax-btn pri full">ひらく</button>
  <label><input id="remember" type="checkbox" checked>この端末に記憶する</label>
  <div id="lockmsg" class="ax-lockmsg"></div>
  <div class="ax-lockskip">
    <button id="skip" class="ax-btn ghost full">アクセスコードなしで開く</button>
    <p>この端末に入っている記録はそのまま使えます。<br>元のExcelから取り込んだ過去の記録だけ、あとで設定から読み込めます。</p>
  </div>
</div>

<main id="app" class="ax-app" hidden>
  <section id="view-home" class="ax-view on"></section>
  <section id="view-schedule" class="ax-view"></section>
  <section id="view-clients" class="ax-view"></section>
  <section id="view-client" class="ax-view"></section>
  <section id="view-report" class="ax-view"></section>
  <section id="view-history" class="ax-view"></section>
  <section id="view-train" class="ax-view"></section>
  <section id="view-settings" class="ax-view"></section>
</main>

<nav id="nav" class="ax-nav" hidden>
  <button data-v="home" class="on"><b>⌂</b>ホーム</button>
  <button data-v="schedule"><b>◷</b>予定</button>
  <button data-v="clients"><b>◎</b>利用者</button>
  <button data-v="history"><b>≡</b>記録</button>
  <button data-v="train"><b>＋</b>トレ中</button>
</nav>

<script src="xlsx.full.min.js"></script>
<script type="module" src="next/app.js?v=29"></script>
</body>
</html>
